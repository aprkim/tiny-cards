<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No user-scalable=no: this is a photo app, and checking whether a crop
     caught the card edge is exactly when you want to pinch-zoom. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Scan greeting cards with your phone: straighten, name, and file them. Nothing is kept on your device unless you ask.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta property="og:title" content="Tiny Cards">
<meta property="og:description" content="Scan greeting cards with your phone: straighten, name, and file them.">
<meta property="og:image" content="https://cards.tinywins.space/og-image.png">
<meta property="og:url" content="https://cards.tinywins.space/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Tiny Cards">
<meta name="twitter:description" content="Scan greeting cards with your phone: straighten, name, and file them.">
<meta name="twitter:image" content="https://cards.tinywins.space/og-image.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FAF9F6">
<title>Tiny Cards</title>
<style>
  :root{
    --ink:#16161D;--paper:#FAF9F6;--accent:#B0184F;--accent-soft:#FBEDF2;
    --muted:#6E6E78;--rule:#E4E2DB;--field:#FFFFFF;
    --barh:calc(54px + env(safe-area-inset-bottom));
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.6;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-font-smoothing:antialiased;touch-action:manipulation;
  }
  .wrap{max-width:460px;margin:0 auto;padding:24px 18px 44px}
  header{margin-bottom:22px}

  /* Fixed bottom nav — Scan and View, on every page. Its own safe-area padding
     clears the iPhone home indicator; --barh reserves matching space above so
     page content never hides behind it. */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;background:var(--paper);border-top:1px solid var(--rule);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar a{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;padding:8px 0 7px;text-decoration:none;color:var(--muted);
    font-size:11px;font-weight:600;letter-spacing:.01em;-webkit-tap-highlight-color:transparent;
  }
  .tabbar a svg{width:23px;height:23px;display:block}
  .tabbar a.on{color:var(--accent)}
  .tabbar a:active{background:rgba(0,0,0,.035)}
  h1{font-size:19px;font-weight:700;letter-spacing:-.02em}
  header p{font-size:13.5px;color:var(--muted);margin-top:3px}
  /* On the home screen everything below is centred, so the title matches.
     The scanner keeps its conventional left-aligned header. */
  body.view-home header{text-align:center}

  /* Both entry points are equal-weight choices, so they get identical boxes.
     Flex centring plus a min-height keeps them matched even though the camera
     option's caption wraps to two lines on a narrow screen. */
  .drop{
    border:1.5px dashed var(--rule);border-radius:14px;padding:22px 20px;
    text-align:center;background:var(--field);cursor:pointer;
    transition:border-color .15s,background .15s;
    min-height:128px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  /* The secondary box must NOT borrow the primary's solid accent look on
     hover — doing so made Choose Photos look exactly like Take Photos'
     resting state, so the two actions became indistinguishable mid-hover.
     It just firms up instead, staying dashed and neutral. */
  .drop:hover,.drop:focus-visible{border-color:#BFBAAE;background:#F3F1EB}
  .drop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .drop strong{display:block;font-size:15.5px;font-weight:600;margin-bottom:6px}
  .drop span{font-size:13px;color:var(--muted)}

  .drop.cam{
    border-style:solid;border-color:var(--accent);background:var(--accent-soft);
  }
  .drop.cam strong{color:var(--accent)}
  /* Primary deepens rather than changing character */
  .drop.cam:hover,.drop.cam:focus-visible{border-color:#8E1340;background:#F7DCE6}

  .orline{
    text-align:center;font-size:12px;color:var(--muted);
    margin:16px 0 12px;text-transform:uppercase;letter-spacing:.06em;
  }

  /* ---- home screen ----
     Fills the space under the header so the pieces can be distributed:
     illustration + count at the top, the action pair low in the thumb zone,
     the account row pinned to the very bottom. 100dvh tracks the real visible
     height as Safari's toolbars come and go. */
  /* Three zones: the header sits above (its own element), the illustration +
     count take the flexible middle and centre within it, and the actions sit
     at the bottom. 100dvh tracks the real visible height as Safari toolbars
     come and go. */
  #home{
    display:flex;flex-direction:column;
    min-height:calc(100dvh - 150px - var(--barh));
  }
  /* Middle zone. justify-content:center would land dead-centre, which reads as
     low with this much whitespace, so the extra bottom padding nudges the block
     to roughly 45%. The top/bottom padding also keeps a gap from the header and
     buttons on short screens (iPhone SE). min-height:0 lets it shrink there. */
  .hero{
    flex:1 1 auto;min-height:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px 0 3vh;
  }
  .heroart{position:relative;height:150px;margin:0 auto 18px;width:126px;flex:0 0 auto}
  .heroart span{position:absolute;border-radius:12px;background:#fff;border:2.5px solid var(--accent)}
  .heroart .c1{inset:12px 22px 12px 0;transform:rotate(-9deg);background:var(--accent-soft)}
  .heroart .c2{inset:0 0 0 24px;display:flex;align-items:center;justify-content:center}
  .heroart svg{width:44px;height:44px;fill:var(--accent)}

  /* The running total. Big enough to feel like progress during a long session. */
  .cardcount{font-size:15px;color:var(--muted);min-height:22px}
  .cardcount b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}

  /* Bottom zone: Scan/View now live in the fixed bar, so this holds only the
     sign-in button (logged out) or the account row (logged in). Both states
     reserve the same height and pin to the bottom so the hero above is identical
     and the illustration doesn't jump on login. */
  .homefill{flex:0 0 auto;display:flex;flex-direction:column;justify-content:flex-end;min-height:76px}
  .signinblock{width:100%}

  .gbtn{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    width:100%;font:inherit;font-size:15.5px;font-weight:600;padding:14px 18px;
    border:1px solid var(--rule);border-radius:12px;background:#fff;color:var(--ink);
    cursor:pointer;transition:border-color .15s,box-shadow .15s;
  }
  .gbtn:hover,.gbtn:focus-visible{border-color:#BFBAAE;box-shadow:0 1px 4px rgba(0,0,0,.07)}
  .gbtn[disabled]{opacity:.55;cursor:progress}

  /* Pinned low and quiet, off the path to the primary button */
  .who{font-size:12px;color:#9A9AA2;text-align:center;margin-top:20px;padding-top:4px}
  .who .linkbtn{color:#9A9AA2;padding-left:6px}
  .who .linkbtn:hover{color:var(--muted)}
  .discardrow{text-align:center;margin-top:12px}
  .discardrow .linkbtn{padding:0;font-size:13px;color:var(--muted);text-decoration:none}
  .discardrow .linkbtn:hover{color:#BF3143;text-decoration:underline}

  .backhome{margin-bottom:14px}
  .backhome .linkbtn{padding:0;font-size:13.5px;text-decoration:none;color:var(--muted)}
  .backhome .linkbtn:hover{color:var(--ink);text-decoration:underline}
  .linkbtn{
    font:inherit;font-size:13px;background:none;border:none;padding:0 0 0 8px;
    color:var(--accent);cursor:pointer;text-decoration:underline;
  }
  /* The base rule is `button.go`, so the archive link matched none of it and
     came out short and unstyled. Both actions are declared here in full, with
     a transparent border on the primary so the secondary's outline does not
     make it taller. */
  .homeacts{display:flex;flex-direction:column;gap:10px}
  .homeacts .go{
    display:block;width:100%;text-align:center;text-decoration:none;
    font:inherit;font-size:15.5px;font-weight:600;line-height:1.4;
    padding:15px;border-radius:12px;cursor:pointer;
    background:var(--accent);color:#fff;border:1.5px solid transparent;
    transition:background .15s,border-color .15s;
  }
  .homeacts .go:hover,.homeacts .go:focus-visible{background:#8E1340}
  .homeacts .go.alt{
    background:var(--field);color:var(--accent);border-color:var(--accent);
  }
  .homeacts .go.alt:hover,.homeacts .go.alt:focus-visible{background:var(--accent-soft)}

  .setup{margin-top:18px;margin-bottom:18px}
  .setup > span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:8px}
  .setup > span em{font-style:normal;font-weight:500;opacity:.75}
  .seg{display:flex;gap:8px}
  .seg button{
    flex:1;min-width:0;font:inherit;font-size:14px;padding:11px 4px;border-radius:10px;
    border:1px solid var(--rule);background:var(--field);color:var(--ink);
    cursor:pointer;line-height:1.35;
  }
  .seg button small{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap}
  .seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .seg button.on small{color:rgba(255,255,255,.6)}

  .hint{
    margin-top:18px;padding:13px 15px;background:var(--field);
    border:1px solid var(--rule);border-radius:12px;
    font-size:13px;color:var(--muted);line-height:1.7;
  }
  .hint b{color:var(--ink);font-weight:600}

  .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .count b{color:var(--ink);font-weight:700;font-size:15px}
  .tag{
    font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);
    padding:3px 11px;border-radius:100px;text-transform:uppercase;letter-spacing:.04em;
  }
  .track{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin-bottom:16px}
  .track i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s ease}

  .stage{
    position:relative;background:#26262E;border-radius:14px;
    overflow:hidden;margin-bottom:14px;user-select:none;-webkit-user-select:none;
  }
  .stage canvas{display:block;width:100%;height:auto}
  .stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .stage polygon{fill:rgba(176,24,79,.14);stroke:var(--accent);stroke-width:2}
  .handle{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;touch-action:none;cursor:grab}
  .handle::after{
    content:'';position:absolute;inset:11px;border-radius:50%;
    background:#fff;border:3px solid var(--accent);box-shadow:0 1px 6px rgba(0,0,0,.35);
  }
  .handle.drag::after{background:var(--accent-soft)}
  .handle:focus-visible{outline:none}
  .handle:focus-visible::after{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--accent)}
  #h0::after{background:var(--accent);border-color:#fff}
  #h0.drag::after{background:var(--accent-soft);border-color:var(--accent)}
  .stagehint{font-size:12.5px;color:var(--muted);line-height:1.5}

  .tools{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .tools .stagehint{flex:1}
  .tool{
    font:inherit;font-size:13px;padding:9px 14px;border-radius:100px;
    border:1px solid var(--rule);background:var(--field);color:var(--ink);
    cursor:pointer;white-space:nowrap;
  }
  .tool:hover{border-color:var(--accent);color:var(--accent)}

  /* Rotate only re-labels which corner becomes top-left, so the quad on screen
     does not move and the change was invisible until the file was saved. This
     shows the actual result. */
  .pvwrap{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0}
  .pvwrap canvas{
    max-width:54px;max-height:54px;border-radius:4px;
    border:1px solid var(--rule);background:#fff;display:block;
  }
  .pvwrap span{
    font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;
  }

  .actions{display:flex;gap:10px}
  button.go{
    flex:1;font:inherit;font-size:15.5px;font-weight:600;padding:15px;
    border:none;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer;
  }
  button.go:disabled{background:var(--rule);color:var(--muted);cursor:not-allowed}
  button.skip{
    font:inherit;font-size:14px;padding:15px 16px;border:1px solid var(--rule);
    border-radius:12px;background:var(--field);color:var(--muted);cursor:pointer;
  }
  button.skip:hover{border-color:var(--ink);color:var(--ink)}

  .pages{display:flex;gap:10px;margin-bottom:18px}
  .pg{flex:1;text-align:center}
  .pg img{
    width:100%;aspect-ratio:1/1;object-fit:contain;background:var(--field);
    border:1px solid var(--rule);border-radius:10px;display:block;padding:4px;
  }
  .pg span{
    display:block;font-size:11.5px;color:var(--muted);margin-top:5px;
    text-transform:uppercase;letter-spacing:.04em;
  }
  /* The image doubles as the way back into the crop for that page. It is
     its own button so the label select beside it stays independent. */
  .pgredo{
    display:block;width:100%;font:inherit;background:none;border:none;padding:0;
    cursor:pointer;-webkit-appearance:none;appearance:none;
  }
  .pgredo img{transition:border-color .15s}
  .pgredo:hover img,.pgredo:focus-visible img{border-color:var(--accent)}
  .pgredo:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}

  .pglabel{
    width:100%;margin-top:5px;font:inherit;font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:.04em;
    color:var(--accent);background:var(--accent-soft);
    border:1px solid transparent;border-radius:6px;padding:4px 20px 4px 8px;cursor:pointer;
    -webkit-appearance:none;appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7' viewBox='0 0 10 7'><path d='M1 1l4 4 4-4' fill='none' stroke='%23B0184F' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;background-position:right 7px center;
  }
  .pglabel:hover{border-color:var(--accent)}
  .pglabel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .thumbhint{
    text-align:center;font-size:11.5px;color:var(--muted);
    margin:-10px 0 14px;
  }
  .pg .bad{
    width:100%;aspect-ratio:3/4;background:var(--field);
    border:1px dashed var(--rule);border-radius:10px;
    display:flex;align-items:center;justify-content:center;text-align:center;
    font-size:11.5px;color:var(--muted);padding:10px;line-height:1.5;
  }

  .warn{
    margin-bottom:16px;padding:12px 14px;border-radius:12px;
    background:var(--accent-soft);border:1px solid rgba(176,24,79,.25);
    font-size:12.5px;line-height:1.65;color:var(--ink);
  }
  .warn b{font-weight:600}

  .name{
    background:var(--ink);border-radius:12px;padding:14px 16px;
    margin-bottom:20px;font-weight:500;letter-spacing:0;
    font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.7;
  }
  .name i{display:block;font-style:normal;font-size:13.5px;color:#fff}
  .name i+i{margin-top:3px}
  .name em i{color:rgba(255,255,255,.72)}

  label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .field{margin-bottom:16px}
  input[type=text],input[type=date],select{
    width:100%;font:inherit;font-size:16px;padding:12px 14px;
    border:1px solid var(--rule);border-radius:10px;background:var(--field);
    color:var(--ink);-webkit-appearance:none;appearance:none;
  }
  select{
    padding-right:34px;cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%236E6E78' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;
  }
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{
    font:inherit;font-size:13px;padding:5px 12px;border-radius:100px;
    border:1px solid var(--rule);background:var(--field);color:var(--ink);cursor:pointer;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent)}

  .done{text-align:center;padding:52px 20px}
  .done h2{font-size:20px;font-weight:700;margin-bottom:8px}
  .done p{font-size:14px;color:var(--muted);margin-bottom:24px}

  .altlink{
    display:inline-block;font-size:13.5px;color:var(--accent);
    text-decoration:none;border-bottom:1px solid transparent;
  }
  .altlink:hover,.altlink:focus-visible{border-bottom-color:var(--accent)}
  .footlink{margin-top:20px;text-align:center}
  #signedOut .footlink{margin-top:16px}

  .opt{
    margin-top:18px;padding:14px 15px;background:var(--field);
    border:1px solid var(--rule);border-radius:12px;
  }
  .opt .row{display:flex;align-items:flex-start;gap:12px}
  .opt .txt{flex:1;min-width:0}
  .opt b{display:block;font-size:13.5px;font-weight:600;margin-bottom:2px}
  .opt small{display:block;font-size:12px;color:var(--muted);line-height:1.6}
  .sw{
    position:relative;flex-shrink:0;width:46px;height:28px;border-radius:100px;
    background:var(--rule);border:none;cursor:pointer;transition:background .18s;padding:0;
  }
  .sw::after{
    content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s;
  }
  .sw[aria-checked=true]{background:var(--accent)}
  .sw[aria-checked=true]::after{transform:translateX(18px)}

  .coderow{
    display:flex;align-items:center;gap:10px;margin-top:12px;
    padding-top:12px;border-top:1px solid var(--rule);
  }
  .coderow code{
    flex:1;min-width:0;font-size:12.5px;color:var(--ink);
    word-break:break-all;line-height:1.5;
  }

  .up{
    margin-bottom:16px;padding:12px 14px;border-radius:12px;
    background:var(--accent-soft);border:1px solid rgba(176,24,79,.25);
    font-size:12.5px;color:var(--ink);
  }
  .up.err{background:#FEF2F2;border-color:#FCA5A5}
  .upbar{height:3px;background:rgba(176,24,79,.18);border-radius:2px;overflow:hidden;margin-top:8px}
  .upbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s ease}

  /* !important so it beats id-specificity display rules like #home{display:flex}
     — without it, adding .hidden to #home did nothing and the home screen
     stayed on top of the scanner. */
  .hidden{display:none!important}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="view-home">
<div class="wrap">

  <header>
    <h1 id="pageTitle">Tiny Cards</h1>
    <p id="pageSub">Scan greeting cards into one shared archive.</p>
  </header>

  <!-- Landing screen. A tall flex column: the illustration and the running
       card count sit up top, the action pair drops into the lower-third thumb
       zone, and the account row is pinned quietly to the very bottom — out of
       the path between the illustration and the primary button. -->
  <section id="home">
    <div class="hero">
      <div class="heroart" aria-hidden="true">
        <span class="c1"></span>
        <span class="c2">
          <svg viewBox="0 0 24 24"><path d="M12 20.5l-6.9-6.6C2.6 11.5 3.4 7.6 6.6 6.4c1.9-.7 4 .1 5.4 1.8 1.4-1.7 3.5-2.5 5.4-1.8 3.2 1.2 4 5.1 1.5 7.5L12 20.5z"/></svg>
        </span>
      </div>
      <!-- Carries state: the number climbing is the point during a 200-card session -->
      <p class="cardcount" id="cardCount" aria-live="polite"></p>
    </div>

    <div id="signedOut" class="homefill">
      <div class="signinblock">
        <button type="button" class="gbtn" id="googleBtn">
          <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
            <path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.3-.2-1.9H9v3.5h4.8a4.1 4.1 0 01-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.5z"/>
            <path fill="#34A853" d="M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.3c-.8.5-1.8.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H.9v2.3A9 9 0 009 18z"/>
            <path fill="#FBBC05" d="M3.9 10.6a5.4 5.4 0 010-3.4V4.9H.9a9 9 0 000 8.1l3-2.4z"/>
            <path fill="#EA4335" d="M9 3.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 00.9 4.9l3 2.3C4.6 5.1 6.6 3.6 9 3.6z"/>
          </svg>
          <span>Sign in with Google</span>
        </button>
      </div>
    </div>

    <div id="signedIn" class="homefill hidden">
      <p class="who"><span id="whoText">Signed in</span>
        <button type="button" class="linkbtn" id="signOutBtn">Sign out</button></p>
    </div>
  </section>


</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
/* Home page only. The scanner lives on scan.html and the archive on cards.html
   — this page signs the user in, shows the running card count, and links out
   to those two. */
(function(){
  var $=function(id){return document.getElementById(id)};
  /* authDomain is auth.tinywins.space (not firebaseapp.com): the sign-in hop
     must stay same-site or Safari's storage partitioning breaks it. */
  var FB={
    apiKey:"AIzaSyBycFP3HfMF7tyshQixvwzoaAE3Df8Fz_8",
    authDomain:"auth.tinywins.space",
    projectId:"tiny-wins25",
    storageBucket:"tiny-wins25.firebasestorage.app",
    messagingSenderId:"497477643272",
    appId:"1:497477643272:web:9f8e43fbffd18003e5f5bd"
  };
  var SPACE='family';
  var fbReady=false,fbDb=null,authUser=null;

  function fbInit(){
    if(fbReady)return true;
    if(typeof firebase==='undefined')return false;
    try{
      if(!firebase.apps.length)firebase.initializeApp(FB);
      fbDb=firebase.firestore();fbReady=true;return true;
    }catch(e){if(window.console)console.warn('Firebase init failed',e);return false}
  }
  function currentUser(){
    if(!fbInit())return Promise.resolve(null);
    if(authUser)return Promise.resolve(authUser);
    return new Promise(function(res){
      var done=false;
      var off=firebase.auth().onAuthStateChanged(function(u){
        if(done)return;done=true;off();authUser=u||null;res(authUser);
      });
    });
  }
  function signIn(){
    if(!fbInit())return Promise.reject(new Error('firebase unavailable'));
    var p=new firebase.auth.GoogleAuthProvider();
    p.setCustomParameters({prompt:'select_account'});
    return firebase.auth().signInWithPopup(p).then(function(r){authUser=r.user;return authUser})
      .catch(function(e){
        var c=e&&e.code||'';
        if(/popup-blocked|popup-closed-by-user|operation-not-supported|cancelled-popup-request/.test(c)){
          return firebase.auth().signInWithRedirect(p);
        }
        throw e;
      });
  }
  function signOutUser(){
    if(!fbInit())return Promise.resolve();
    return firebase.auth().signOut().then(function(){authUser=null});
  }

  function paintHome(){
    var signedIn=!!authUser;
    $('signedIn').classList.toggle('hidden',!signedIn);
    $('signedOut').classList.toggle('hidden',signedIn);
    // Explain the app before login (what Nathan and Hazel first see); tagline once in.
    $('pageSub').textContent=signedIn
      ? 'Every card, kept.'
      : 'Scan greeting cards into one shared archive.';
    if(signedIn){
      $('whoText').textContent='Signed in as '+(authUser.email||authUser.displayName||'your account');
      paintCount();
    }
  }

  /* Saved-card total, read once from the shared archive doc — a climbing number
     is the motivation during a long scanning session. */
  function paintCount(){
    var el=$('cardCount');
    if(!el||!authUser)return;
    currentUser().then(function(u){
      if(!u)return null;
      return fbDb.collection('tinyCards').doc(SPACE).get();
    }).then(function(doc){
      var n=(doc&&doc.exists&&(doc.data().cards||[]).length)||0;
      el.innerHTML=n?'<b>'+n+'</b> card'+(n===1?'':'s')+' saved':'No cards yet — scan your first';
    }).catch(function(){el.textContent=''});
  }

  $('googleBtn').onclick=function(){
    var btn=$('googleBtn');
    btn.disabled=true;btn.querySelector('span').textContent='Signing in…';
    signIn().then(function(u){
      if(!u)return;            // redirect flow: we come back later
      paintHome();
    }).catch(function(e){
      var c=e&&e.code||'';
      if(/unauthorized-domain/.test(c)){
        alert('This site is not authorised for sign-in yet. Add cards.tinywins.space in the Firebase console under Authentication → Settings → Authorized domains.');
      }else if(!/popup-closed-by-user|cancelled-popup-request/.test(c)){
        alert('Could not sign in. Check your connection and try again.');
      }
      if(window.console)console.warn(e);
    }).then(function(){
      btn.disabled=false;btn.querySelector('span').textContent='Sign in with Google';
    });
  };
  $('signOutBtn').onclick=function(){signOutUser().then(paintHome)};

  currentUser().then(function(u){
    paintHome();
    if(!u&&fbReady){
      firebase.auth().getRedirectResult().then(function(r){
        if(r&&r.user){authUser=r.user;paintHome()}
      }).catch(function(){});
    }
  });
  paintHome();
})();
</script>
