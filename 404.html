<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Kept Cards</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f2f2f0; --ink:#111; --muted:#5c5c5c; --accent:#B0184F; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); font-family:'Inter',-apple-system,sans-serif; font-size:16px; line-height:1.65; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100vh; }
  a { color:var(--ink); }
  a:focus-visible { outline:2px solid var(--ink); outline-offset:3px; }
  .eyebrow { font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); }
  header.site { display:flex; align-items:center; justify-content:space-between; padding:28px 6vw; }
  .logo { white-space:nowrap; font-weight:700; font-size:18px; letter-spacing:-0.01em; text-decoration:none; }
  header.site nav a { text-decoration:none; font-size:14px; color:var(--muted); margin-left:28px; }
  header.site nav a:hover { color:var(--ink); }
  /* Phone: the logo and four nav links do not fit on one row at 375px — the
     logo wrapped to two lines and the nav spilled below it. Stack them and let
     the links flow instead. */
  @media (max-width:640px){
    header.site { flex-direction:column; align-items:flex-start; gap:12px; padding:22px 6vw 18px; }
    header.site nav { display:flex; flex-wrap:wrap; gap:20px; }
    header.site nav a { margin-left:0; }
  }

  /* Centring on the available space puts the block at roughly 55% of the
     viewport, because the header eats the top. The extra bottom padding pulls
     it back up to an optical centre around 43%. */
  main.wrap { flex:1; max-width:820px; width:100%; margin:0 auto; padding:40px 6vw calc(48px + 24vh); display:flex; flex-direction:column; align-items:center; text-align:center; justify-content:center; }
  h1 { font-size:clamp(34px,5vw,48px); font-weight:700; letter-spacing:-0.02em; line-height:1.1; margin:14px 0 18px; }
  .lede { font-size:18px; color:var(--muted); max-width:46ch; margin-bottom:36px; }
  .btn { display:inline-block; text-decoration:none; font-size:15px; font-weight:600; padding:13px 24px; border-radius:10px; background:var(--accent); border:1px solid var(--accent); color:#fff; transition:opacity .15s ease; }
  .btn:hover { opacity:.92; }
</style>
</head>
<body>

<header class="site">
  <a class="logo" href="/">Kept</a>
  <nav>
    <a href="/support">Support</a>
    <a href="/privacy">Privacy</a>
    <a href="/terms">Terms</a>
    <a href="mailto:hello@lihallc.com">Contact</a>
  </nav>
</header>

<main class="wrap">

  <span class="eyebrow">Error 404</span>
  <h1>This page isn't here</h1>
  <p class="lede">The link may be out of date, or the address slightly off.</p>

  <a class="btn" href="/">Open Kept</a>

</main>

</body>
</html>
