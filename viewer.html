<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F6">
<title>Card File Viewer</title>
<meta name="description" content="Browse a folder of exported Kept files. Works entirely offline — nothing is uploaded.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--
  This page is deliberately SELF-CONTAINED: no Firebase, no SDKs, no network
  requests at all. (The back link only reads the session other pages already
  saved on this device — see the last script.) It exists as the escape hatch
  for the export ZIP — if the cloud archive is ever gone, a saved copy of this
  one file still browses the exported images, because the filenames carry the
  data.
-->
<style>
  :root{
    --ink:#16161D;--paper:#FAF9F6;--accent:#B0184F;--accent-soft:#FBEDF2;
    --muted:#6E6E78;--rule:#E4E2DB;--field:#FFFFFF;
    /* Same bottom-nav sizing as index/cards/scan. env() is 0 in a desktop
       browser, so --barh collapses to --tabbar-height there. */
    --tabbar-height:54px;
    --barh:calc(var(--tabbar-height) + env(safe-area-inset-bottom));
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.6;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-font-smoothing:antialiased;
  }
  /* Fills the visible height (100vh first for iOS 15.0-15.3, which lack dvh)
     so the landing can centre in it. The bottom clearance for the fixed tab
     bar moved onto #view, the only content tall enough to need it, which puts
     the results list exactly where it was. */
  .wrap{
    max-width:760px;margin:0 auto;padding:26px 18px 0;
    display:flex;flex-direction:column;
    min-height:calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    min-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  }
  #view{padding-bottom:calc(60px + var(--barh))}
  /* Landing: button and back link centred between the title and the tab bar,
     the way the Scan screen balances its buttons. Written as :not(.hidden)
     because an id rule outranks .hidden (not !important here), and the script
     hides #start by adding that class once files are open. */
  #start:not(.hidden){
    flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;
    padding-bottom:calc(16px + var(--tabbar-height));
  }
  header{margin-bottom:22px}

  /* Fixed bottom nav — the same Scan/View bar every other page has. The viewer
     was the one screen without it, so opening a folder of exported files left
     no way back at all: the "Back to your cards" link lives in #start, which is
     hidden once #view appears, and a native webview has no browser chrome to
     fall back on. */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;background:var(--paper);border-top:1px solid var(--rule);
    min-height:var(--tabbar-height);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar a{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;padding:8px 0 7px;text-decoration:none;color:var(--muted);
    font-size:11px;font-weight:600;letter-spacing:.01em;-webkit-tap-highlight-color:transparent;
  }
  .tabbar a svg{width:23px;height:23px;display:block}
  .tabbar a.on{color:var(--accent)}
  .tabbar a:active{background:rgba(0,0,0,.035)}
  h1{font-size:19px;font-weight:700;letter-spacing:-.02em}

  /* Same box as Take Photos on the Scan screen (.drop.cam there): full width,
     128px minimum, 14px corners, solid brand border on the pink fill. The folder
     icon and both lines are scaled to fit inside that height. */
  .drop{
    border:1.5px solid var(--accent);border-radius:14px;padding:22px 20px;
    text-align:center;background:var(--accent-soft);cursor:pointer;
    transition:border-color .15s,background .15s;
    min-height:128px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  .drop:hover,.drop:focus-visible,.drop:active{border-color:#8E1340;background:#F7DCE6}
  .dropicon{width:32px;height:32px;color:var(--accent);margin-bottom:8px}
  .drop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .drop strong{display:block;font-size:15.5px;font-weight:600;color:var(--accent);margin-bottom:4px}
  /* Darker than --muted: that gray measured 4.44:1 on this pink (3.92 pressed),
     under the 4.5 minimum, and this line is read by people who struggle with it. */
  .drop span{font-size:13px;color:#63636D}

  input[type=search]{
    width:100%;font:inherit;font-size:16px;padding:12px 14px;
    border:1px solid var(--rule);border-radius:10px;background:var(--field);
    color:var(--ink);-webkit-appearance:none;appearance:none;
  }
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{
    font:inherit;font-size:13px;padding:6px 13px;border-radius:100px;
    border:1px solid var(--rule);background:var(--field);color:var(--ink);cursor:pointer;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip b{font-weight:500;opacity:.5;margin-left:5px}

  .meta{font-size:13px;color:var(--muted);margin:22px 0 12px;font-variant-numeric:tabular-nums}

  .group{margin-bottom:34px}
  .group h2{
    font-size:14.5px;font-weight:700;letter-spacing:-.01em;
    padding-bottom:9px;border-bottom:1px solid var(--rule);margin-bottom:16px;
  }
  .group h2 span{font-weight:500;color:var(--muted);margin-left:8px;font-size:13px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:14px}
  .card{cursor:pointer;border:none;background:none;padding:0;font:inherit;text-align:left;position:relative}
  .card img{
    width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--field);
    border:1px solid var(--rule);border-radius:10px;display:block;
  }
  .card:hover img{border-color:var(--accent)}
  .card .n{
    position:absolute;top:7px;right:7px;background:rgba(22,22,29,.82);color:#fff;
    font-size:11px;font-weight:600;padding:2px 8px;border-radius:100px;
  }
  .card p{font-size:13.5px;font-weight:600;margin-top:8px;letter-spacing:-.01em}
  .card small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

  .empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:14px}

  .box{
    position:fixed;inset:0;background:rgba(22,22,29,.94);z-index:50;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:22px;gap:14px;overflow-y:auto;
  }
  .box::before,.box::after{content:'';flex:0 0 auto}
  .box::before{margin-top:auto}
  .box::after{margin-bottom:auto}
  .box>*{flex:0 0 auto}
  .box img{max-width:100%;max-height:calc(100vh - 200px);object-fit:contain;border-radius:8px}
  .box .cap{color:#fff;text-align:center}
  .box .cap strong{display:block;font-size:16px;font-weight:600}
  .box .cap small{font-size:13px;opacity:.6;font-variant-numeric:tabular-nums}
  .box .nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .box button{
    font:inherit;font-size:13.5px;padding:9px 18px;border-radius:100px;
    border:1px solid rgba(255,255,255,.3);background:none;color:#fff;cursor:pointer;
    text-transform:capitalize;
  }
  .box button:hover{background:rgba(255,255,255,.12)}
  .box button.on{background:#fff;color:var(--ink);border-color:#fff}

  .footlink{margin-top:20px;text-align:center}
  #start .footlink{margin-top:28px}
  .altlink{
    display:inline-block;font-size:13.5px;color:var(--accent);
    text-decoration:none;border-bottom:1px solid transparent;
  }
  .altlink:hover,.altlink:focus-visible{border-bottom-color:var(--accent)}

  .hidden{display:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Card File Viewer</h1>
  </header>

  <section id="start">
    <div class="drop" id="drop" tabindex="0" role="button">
      <svg class="dropicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4.1c.4 0 .78.16 1.06.44L11.2 8h8.3A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>
      <strong>Open Card Files</strong>
      <span>Select files</span>
    </div>
    <input type="file" id="picker" accept="image/*" multiple class="hidden">

    <div class="footlink">
      <!-- Starts as the signed-out link, which is right for everyone; the
           script at the end upgrades it when this device holds a session. -->
      <a class="altlink" id="backLink" href="./">&larr; Back</a>
    </div>
  </section>

  <section id="view" class="hidden">
    <input type="search" id="q" placeholder="Search a name or occasion" autocomplete="off">
    <div class="chips" id="people"></div>
    <p class="meta" id="meta"></p>
    <div id="groups"></div>
  </section>

</div>

<div class="box hidden" id="box">
  <img id="boxImg" alt="">
  <div class="cap">
    <strong id="boxName"></strong>
    <small id="boxSub"></small>
  </div>
  <div class="nav" id="boxNav"></div>
  <button id="boxClose">Close</button>
</div>

<script>
(function(){
  var cards=[],urls=[],filter=null,openCard=null,openPage=0,showAllPeople=false;
  var $=function(id){return document.getElementById(id)};
  var picker=$('picker'),drop=$('drop');

  drop.onclick=openFiles;
  drop.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openFiles()}};

  var DATE=/^(\d{4})-(\d{2})-(\d{2})\s+(.+)$/;
  var PAGE=/^(.*?)\s+-\s+(front|inside|back|p\d+)$/i;
  var FROM=/^(.*?)\s+from\s+(.+)$/i;
  var ORDER={front:0,inside:1,back:2};

  /* Two filename shapes are supported:
       new  2026-08-03 Mothers Day - Hazel from Grandma Kim - front
       old  2026-08-02 HazelBirthday Grandma Kim - front
     The old shape has no "from", so the occasion is the first word only —
     that is why it was always written as one run-together token. The new
     shape delimits on " from ", which lets the occasion contain spaces. */
  function parse(stem){
    var m=stem.match(DATE);
    if(!m)return null;

    var rest=m[4].trim(),label='';
    var pm=rest.match(PAGE);
    if(pm){rest=pm[1].trim();label=pm[2].toLowerCase()}

    var event,person,recipient='';
    var fm=rest.match(FROM);
    if(fm){
      var left=fm[1].trim();
      person=fm[2].trim();
      var cut=left.lastIndexOf(' - ');
      if(cut>-1){event=left.slice(0,cut).trim();recipient=left.slice(cut+3).trim()}
      else event=left;
    }else{
      var sp=rest.indexOf(' ');
      if(sp<0){event=rest;person=''}
      else{event=rest.slice(0,sp);person=rest.slice(sp+1).trim()}
    }

    if(!event)return null;
    return {date:m[1]+'-'+m[2]+'-'+m[3],year:m[1],event:event,
            person:person||'Unknown',recipient:recipient,label:label};
  }

  picker.onchange=function(){
    if(!picker.files.length)return;
    ingest(picker.files);
  };

  /* iOS app only. A web <input type="file" accept="image/*"> makes iOS ask
     Photo Library / Take Photo / Choose Files first, but exported cards live in
     Files — so open the document picker directly. Everywhere else (a desktop
     browser, or an older app build without the plugin) the input still runs.

     The plugin copies each pick to a temporary file and returns a webPath the
     web view can load, so the picks go to ingest() as {name, type, url} and the
     images load from disk exactly as input files do. Reading them into Blobs
     first would hold a whole export in memory at once, which a few hundred
     card photos can be enough to get the web view killed for.

     This page still loads no SDK: window.Capacitor is injected by the native
     bridge, and on the web it simply isn't there. */
  function nativePicker(){
    var C=window.Capacitor;
    return !!(C&&typeof C.isNativePlatform==='function'&&C.isNativePlatform()&&
              typeof C.isPluginAvailable==='function'&&C.isPluginAvailable('FilePicker'));
  }
  var picking=false;
  function openFiles(){
    if(!nativePicker()){picker.value='';picker.click();return;}
    if(picking)return;                     // one picker at a time
    picking=true;
    window.Capacitor.Plugins.FilePicker.pickFiles({types:['image/*'],limit:0}).then(function(r){
      var picked=((r&&r.files)||[]).map(function(p){
        return {name:p.name||'',type:p.mimeType||'',url:p.webPath||''};
      }).filter(function(p){return p.url;});
      if(picked.length)ingest(picked);
    }).catch(function(e){
      var m=(e&&(e.message||(''+e)))||'';
      if(/cancel/i.test(m))return;           // closed the picker without choosing
      if(window.console)console.warn('file picker',e);
      alert('Could not open those files. Please try again.');
    }).then(function(){picking=false;});
  }

  // The original change handler, unchanged except that it takes its list as an
  // argument and uses a pick's own url when it has one.
  function ingest(files){
    urls.forEach(URL.revokeObjectURL);
    cards=[];urls=[];
    var byKey={};

    Array.prototype.slice.call(files).forEach(function(f){
      if(!/^image\//.test(f.type))return;
      var stem=f.name.replace(/\.[^.]+$/,'');
      var u=f.url||URL.createObjectURL(f);urls.push(u);

      var p=parse(stem);
      if(!p){
        cards.push({key:stem,date:'',year:'',event:'Unsorted',person:stem,recipient:'',
                    ok:false,pages:[{url:u,label:''}]});
        return;
      }

      var key=p.date+'|'+p.event+'|'+p.recipient+'|'+p.person;
      if(!byKey[key]){
        byKey[key]={key:key,date:p.date,year:p.year,event:p.event,
                    person:p.person,recipient:p.recipient,ok:true,pages:[]};
        cards.push(byKey[key]);
      }
      byKey[key].pages.push({url:u,label:p.label});
    });

    cards.forEach(function(c){
      c.pages.sort(function(a,b){
        var x=ORDER[a.label],y=ORDER[b.label];
        if(x===undefined)x=9;if(y===undefined)y=9;
        return x-y||a.label.localeCompare(b.label);
      });
    });

    cards.sort(function(a,b){
      if(a.date===b.date)return a.person.localeCompare(b.person);
      return b.date.localeCompare(a.date);
    });

    $('start').classList.add('hidden');
    $('view').classList.remove('hidden');
    people();render();
  }

  function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
  function plur(n,s,p){return n+' '+(n===1?s:(p||s+'s'));}

  function people(){
    var c={},box=$('people');box.innerHTML='';
    cards.forEach(function(x){if(x.ok)c[x.person]=(c[x.person]||0)+1});
    var names=Object.keys(c).sort(function(a,b){return c[b]-c[a]||a.localeCompare(b)});

    var LIMIT=14;
    var shown=(showAllPeople||names.length<=LIMIT)?names:names.slice(0,LIMIT);

    shown.forEach(function(n){
      var b=document.createElement('button');
      b.className='chip'+(filter===n?' on':'');b.type='button';
      b.innerHTML=esc(n)+'<b>'+c[n]+'</b>';
      b.onclick=function(){filter=(filter===n?null:n);people();render()};
      box.appendChild(b);
    });

    if(names.length>LIMIT){
      var more=document.createElement('button');
      more.className='chip';more.type='button';
      more.textContent=showAllPeople?'Show fewer':'+'+(names.length-LIMIT)+' more';
      more.onclick=function(){showAllPeople=!showAllPeople;people()};
      box.appendChild(more);
    }
  }

  function render(){
    var q=$('q').value.trim().toLowerCase();
    var list=cards.filter(function(x){
      if(filter&&x.person!==filter)return false;
      if(!q)return true;
      return (x.person+' '+x.recipient+' '+x.event+' '+x.date).toLowerCase().indexOf(q)>-1;
    });

    var who={},shots=0;
    list.forEach(function(x){who[x.person]=1;shots+=x.pages.length});
    $('meta').textContent=plur(list.length,'card')+' · '+plur(shots,'photo')+' · '+plur(Object.keys(who).length,'person','people');

    var buckets={},order=[];
    list.forEach(function(x){
      var k=x.ok?(x.year+' '+x.event):'Unsorted';
      if(!buckets[k]){buckets[k]=[];order.push(k)}
      buckets[k].push(x);
    });

    var out=$('groups');out.innerHTML='';
    if(!list.length){out.innerHTML='<p class="empty">No cards match.</p>';return}

    order.forEach(function(k){
      var sec=document.createElement('div');sec.className='group';
      var h=document.createElement('h2');
      h.innerHTML=esc(k)+'<span>'+plur(buckets[k].length,'card')+'</span>';
      sec.appendChild(h);
      var g=document.createElement('div');g.className='grid';
      buckets[k].forEach(function(x){
        var b=document.createElement('button');b.className='card';b.type='button';
        var badge=x.pages.length>1?'<span class="n">'+x.pages.length+'</span>':'';
        var sub=(x.date||'no date')+(x.recipient?' · to '+x.recipient:'');
        b.innerHTML='<img loading="lazy" src="'+x.pages[0].url+'" alt="'+esc(x.person)+'">'+badge+
                    '<p>'+esc(x.person)+'</p><small>'+esc(sub)+'</small>';
        b.onclick=function(){show(x,0)};
        g.appendChild(b);
      });
      sec.appendChild(g);out.appendChild(sec);
    });
  }

  function show(card,page){
    openCard=card;openPage=page;
    var p=card.pages[page];
    $('boxImg').src=p.url;
    $('boxName').textContent=card.person+(card.recipient?' → '+card.recipient:'');
    $('boxSub').textContent=(card.date?card.date+' · ':'')+card.event;
    var nav=$('boxNav');nav.innerHTML='';
    if(card.pages.length>1){
      card.pages.forEach(function(pg,i){
        var b=document.createElement('button');
        b.type='button';b.textContent=pg.label||('p'+(i+1));
        if(i===page)b.className='on';
        b.onclick=function(e){e.stopPropagation();show(card,i)};
        nav.appendChild(b);
      });
    }
    $('box').classList.remove('hidden');
  }

  function close(){$('box').classList.add('hidden');$('boxImg').src='';openCard=null}

  $('boxClose').onclick=close;
  $('box').onclick=function(e){if(e.target===$('box'))close()};
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape')close();
    if(!openCard)return;
    if(e.key==='ArrowRight'&&openPage<openCard.pages.length-1)show(openCard,openPage+1);
    if(e.key==='ArrowLeft'&&openPage>0)show(openCard,openPage-1);
  });
  $('q').addEventListener('input',render);
})();
</script>
<!-- Neither tab is marked current: the viewer is reached from a link inside
     View, not from the bar itself, so highlighting one would misreport where
     you are. -->
<nav class="tabbar" aria-label="Primary">
  <a href="scan.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9a2 2 0 0 1 2-2h1.6l1.2-1.8A1 1 0 0 1 9.6 5h4.8a1 1 0 0 1 .8.4L16.4 7H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.3"/></svg>
    <span>Scan</span>
  </a>
  <a href="cards.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.4" height="6.4" rx="1.6"/><rect x="13.6" y="4" width="6.4" height="6.4" rx="1.6"/><rect x="4" y="13.6" width="6.4" height="6.4" rx="1.6"/><rect x="13.6" y="13.6" width="6.4" height="6.4" rx="1.6"/></svg>
    <span>View</span>
  </a>
</nav>
<script>
/* Back link. This page stays self-contained — no Firebase SDK, no network —
   so rather than ask Firebase who is signed in, it looks for the session that
   the other pages' Firebase SDK (v8, default LOCAL persistence) has already
   saved on this device: localStorage first, then the IndexedDB store that SDK
   prefers. Any "firebase:authUser:" entry counts, so an API-key change can't
   silently break it.

   The default is the signed-out "← Back" to the home screen, which works for
   everyone. If the lookup fails or that storage format ever changes, the link
   still goes somewhere sensible; it just says less. */
(function(){
  var PREFIX='firebase:authUser:';
  function upgrade(){
    var a=document.getElementById('backLink');
    if(!a)return;
    a.textContent='\u2190 Back to your cards';
    a.setAttribute('href','cards.html');
  }
  try{
    for(var i=0;i<localStorage.length;i++){
      if((localStorage.key(i)||'').indexOf(PREFIX)===0){upgrade();return;}
    }
  }catch(e){}
  try{
    if(!window.indexedDB)return;
    var open=indexedDB.open('firebaseLocalStorageDb');
    /* Never create that database from here. If it doesn't exist yet, opening
       it would make an empty one, and the Firebase SDK on the other pages would
       then find a database without its store. Abort instead. */
    open.onupgradeneeded=function(){open.transaction.abort();};
    open.onerror=function(e){if(e&&e.preventDefault)e.preventDefault();};
    open.onsuccess=function(){
      var db=open.result;
      try{
        if(!db.objectStoreNames.contains('firebaseLocalStorage')){db.close();return;}
        var cur=db.transaction('firebaseLocalStorage','readonly').objectStore('firebaseLocalStorage').openCursor();
        cur.onsuccess=function(){
          var c=cur.result;
          if(!c){db.close();return;}
          if(String(c.key).indexOf(PREFIX)===0&&c.value&&c.value.value){upgrade();db.close();return;}
          c.continue();
        };
        cur.onerror=function(){db.close();};
      }catch(e){db.close();}
    };
  }catch(e){}
})();
</script>
</body>
</html>
