<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FAF9F6">
<title>View Cards</title>
<meta name="description" content="Browse your scanned greeting cards by sender, occasion, and year.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta property="og:title" content="Tiny Cards — Archive">
<meta property="og:description" content="Browse your scanned greeting cards by sender, occasion, and year.">
<meta property="og:image" content="https://cards.tinywins.space/og-image.png">
<meta property="og:url" content="https://cards.tinywins.space/cards.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Tiny Cards — Archive">
<meta name="twitter:description" content="Browse your scanned greeting cards by sender, occasion, and year.">
<meta name="twitter:image" content="https://cards.tinywins.space/og-image.png">
<style>
  :root{
    --ink:#16161D;--paper:#FAF9F6;--accent:#B0184F;--accent-soft:#FBEDF2;
    --muted:#6E6E78;--rule:#E4E2DB;--field:#FFFFFF;
    --barh:calc(54px + env(safe-area-inset-bottom));
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.6;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:26px 18px calc(60px + var(--barh))}
  header{margin-bottom:22px}

  /* Fixed bottom nav — Scan and View, on every page. Its own safe-area padding
     clears the iPhone home indicator; --barh reserves matching space above so
     page content never hides behind it. It sits under the lightbox and modal
     (higher z-index), so both still cover it when open. */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;background:var(--paper);border-top:1px solid var(--rule);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar a{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;padding:8px 0 7px;text-decoration:none;color:var(--muted);
    font-size:11px;font-weight:600;letter-spacing:.01em;-webkit-tap-highlight-color:transparent;
  }
  .tabbar a svg{width:23px;height:23px;display:block}
  .tabbar a.on{color:var(--accent)}
  .tabbar a:active{background:rgba(0,0,0,.035)}
  h1{font-size:19px;font-weight:700;letter-spacing:-.02em}
  header p{font-size:13.5px;color:var(--muted);margin-top:3px}

  /* Equal-weight choices get identical boxes, matched even when a caption
     wraps to two lines on a narrow screen. */
  .drop{
    border:1.5px dashed var(--rule);border-radius:14px;padding:22px 20px;
    text-align:center;background:var(--field);cursor:pointer;
    transition:border-color .15s,background .15s;
    min-height:128px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  /* Secondary must not adopt the primary's accent look on hover, or the two
     become indistinguishable while the pointer is over one of them. */
  .drop:hover,.drop:focus-visible{border-color:#BFBAAE;background:#F3F1EB}
  .drop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .drop strong{display:block;font-size:15.5px;font-weight:600;margin-bottom:6px}
  .drop span{font-size:13px;color:var(--muted)}

  input[type=search]{
    width:100%;font:inherit;font-size:16px;padding:12px 14px;
    border:1px solid var(--rule);border-radius:10px;background:var(--field);
    color:var(--ink);-webkit-appearance:none;appearance:none;
  }
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{
    font:inherit;font-size:13px;padding:6px 13px;border-radius:100px;
    border:1px solid var(--rule);background:var(--field);color:var(--ink);cursor:pointer;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip b{font-weight:500;opacity:.5;margin-left:5px}

  .metarow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px}
  .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .dangerbtn{
    font:inherit;font-size:12.5px;padding:6px 13px;border-radius:100px;flex-shrink:0;
    border:1px solid var(--rule);background:var(--field);color:var(--muted);cursor:pointer;
  }
  .dangerbtn:hover{border-color:#BF3143;color:#BF3143;background:#FEF2F2}

  .group{margin-bottom:34px}
  .group h2{
    font-size:14.5px;font-weight:700;letter-spacing:-.01em;
    padding-bottom:9px;border-bottom:1px solid var(--rule);margin-bottom:16px;
  }
  .group h2 span{font-weight:500;color:var(--muted);margin-left:8px;font-size:13px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:14px}
  .card{cursor:pointer;border:none;background:none;padding:0;font:inherit;text-align:left;position:relative}
  .card img{
    width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--field);
    border:1px solid var(--rule);border-radius:10px;display:block;
  }
  .card:hover img{border-color:var(--accent)}
  .card .n{
    position:absolute;top:7px;right:7px;background:rgba(22,22,29,.82);color:#fff;
    font-size:11px;font-weight:600;padding:2px 8px;border-radius:100px;
  }
  .card p{font-size:13.5px;font-weight:600;margin-top:8px;letter-spacing:-.01em}
  .card small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

  .empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:14px}

  .box{
    position:fixed;inset:0;background:rgba(22,22,29,.94);z-index:50;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:22px;gap:14px;overflow-y:auto;
  }
  /* Auto-margin pseudo-elements centre the content while still allowing it to
     scroll. justify-content:center would clip the top once the edit form makes
     the contents taller than the viewport, putting Save out of reach. */
  .box::before,.box::after{content:'';flex:0 0 auto}
  .box::before{margin-top:auto}
  .box::after{margin-bottom:auto}
  .box>*{flex:0 0 auto}
  .box img{max-width:100%;max-height:calc(100vh - 200px);object-fit:contain;border-radius:8px}
  /* Give the form room on short screens */
  .box.editing img{max-height:32vh}
  .box .cap{color:#fff;text-align:center}
  .box .cap strong{display:block;font-size:16px;font-weight:600}
  .box .cap small{font-size:13px;opacity:.6;font-variant-numeric:tabular-nums}
  .box .nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .box button{
    font:inherit;font-size:13.5px;padding:9px 18px;border-radius:100px;
    border:1px solid rgba(255,255,255,.3);background:none;color:#fff;cursor:pointer;
    text-transform:capitalize;
  }
  .box button:hover{background:rgba(255,255,255,.12)}
  .box button.on{background:#fff;color:var(--ink);border-color:#fff}
  /* Close is an X pinned to the top-right of the lightbox. Fixed, so it stays
     put while a tall card scrolls; overrides the pill button styles above. */
  .box button.boxx{
    position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:14px;z-index:51;
    width:40px;height:40px;padding:0;border-radius:50%;text-transform:none;
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.28);
  }
  .box button.boxx:hover{background:rgba(255,255,255,.16)}
  .box button.boxx svg{width:20px;height:20px;display:block}

  /* ---- confirm dialog ----
     Reusable across delete, sign-out, bulk actions and export. Cream surface
     and the same type scale as the rest of the app; no browser chrome. */
  .scrim{
    position:fixed;inset:0;z-index:60;background:rgba(22,22,29,.45);
    display:flex;justify-content:center;align-items:center;
    padding:20px;
  }
  .sheet{
    background:var(--paper);border-radius:18px;
    width:100%;max-width:400px;padding:26px 22px 20px;
    box-shadow:0 16px 48px rgba(22,22,29,.28);
  }
  .sheet h2{font-size:18px;font-weight:700;letter-spacing:-.01em;margin-bottom:8px}
  .sheet p{font-size:14px;color:var(--muted);line-height:1.55;margin-bottom:22px}
  .sheet-acts{display:flex;flex-direction:column;gap:10px}
  /* Same geometry as the home Scan/View buttons. */
  .sheet-acts button{
    font:inherit;font-size:15.5px;font-weight:600;padding:14px;border-radius:12px;
    border:1.5px solid transparent;cursor:pointer;transition:background .15s,border-color .15s;
  }
  /* Cancel is the safe default: solid and prominent. */
  #modalCancel{background:var(--ink);color:#fff}
  #modalCancel:hover,#modalCancel:focus-visible{background:#000}
  #modalCancel:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* Confirm is neutral by default; destructive is a truer red than the brand
     crimson, outlined so it never reads as the primary crimson CTA. */
  #modalConfirm{background:var(--field);color:var(--ink);border-color:var(--rule)}
  #modalConfirm.danger{background:var(--field);color:#C62828;border-color:#C62828}
  #modalConfirm.danger:hover,#modalConfirm.danger:focus-visible{background:#FBEBEA}

  /* Mobile: slide up from the bottom edge, within thumb reach. */
  @media (max-width:560px){
    .scrim{align-items:flex-end;padding:0}
    .sheet{
      max-width:none;border-radius:20px 20px 0 0;
      padding:24px 20px calc(24px + env(safe-area-inset-bottom));
      animation:sheetup .22s ease;
    }
    @keyframes sheetup{from{transform:translateY(100%)}to{transform:translateY(0)}}
  }
  @media (prefers-reduced-motion:reduce){.sheet{animation:none}}

  /* ---- settings sheet ----
     Reuses the .scrim/.sheet surface (bottom sheet on mobile). Built as a real
     list, not a one-off menu: Account + Sign out today, and export — desktop-
     only, needing a home — lands here next as another row. */
  .set-list{margin-top:2px}
  .set-row{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    width:100%;padding:13px 2px;font-size:15px;
  }
  .set-row .set-k{color:var(--muted);font-weight:500;flex-shrink:0}
  .set-row .set-v{color:var(--ink);font-weight:500;text-align:right;overflow-wrap:anywhere}
  .set-sep{height:1px;background:var(--rule);margin:2px 0}
  /* Action rows are buttons; the static Account row is plain text. */
  button.set-row{
    font:inherit;background:none;border:none;cursor:pointer;text-align:left;
    color:var(--ink);font-weight:600;border-radius:8px;-webkit-tap-highlight-color:transparent;
  }
  button.set-row:hover,button.set-row:focus-visible{color:var(--accent)}
  button.set-row:focus-visible{outline:none}
  .set-hint{color:var(--muted);font-weight:400;font-size:13px}
  /* Build stamp — bumped every deploy so it's obvious whether the live page is
     the current version. */
  .setver{margin-top:16px;text-align:center;font-size:10px;color:#9A9AA2;letter-spacing:.02em}
  /* Sign out reads as a real button and acts on the first tap (no confirm). */
  .signout{
    display:block;width:100%;font:inherit;font-size:15px;font-weight:600;
    margin-top:6px;padding:13px;border-radius:12px;cursor:pointer;
    background:var(--field);color:var(--ink);border:1.5px solid var(--rule);
    transition:border-color .15s,background .15s,color .15s;-webkit-tap-highlight-color:transparent;
  }
  .signout:hover,.signout:focus-visible{border-color:#BF3143;color:#BF3143;background:#FEF2F2}
  .signout:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* Gear, top-right of the View header — a deliberate reach, the opposite end
     from the bottom bar so sign-out can't be fat-fingered mid-upload. Only
     shown when signed in. */
  header.viewhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .gear{
    flex-shrink:0;width:40px;height:40px;margin:-6px -8px 0 0;
    display:inline-flex;align-items:center;justify-content:center;
    background:none;border:none;cursor:pointer;color:var(--muted);border-radius:10px;
    -webkit-tap-highlight-color:transparent;
  }
  .gear:hover,.gear:focus-visible{color:var(--ink);background:rgba(0,0,0,.05)}
  .gear:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .gear svg{width:22px;height:22px;display:block}

  .drop.primary{
    border-style:solid;border-color:var(--accent);background:var(--accent-soft);margin-bottom:14px;
  }
  .drop.primary strong{color:var(--accent)}
  .drop.primary:hover,.drop.primary:focus-visible{border-color:#8E1340;background:#F7DCE6}

  .rowbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px}
  .minibtn{
    font:inherit;font-size:13px;padding:8px 15px;border-radius:100px;
    border:1px solid rgba(255,255,255,.3);background:none;color:#fff;cursor:pointer;
  }
  .minibtn:hover{background:rgba(255,255,255,.12)}
  .minibtn.danger:hover{background:rgba(255,90,90,.25);border-color:rgba(255,120,120,.6)}

  .edit{
    background:var(--field);border-radius:12px;padding:16px;margin-top:4px;
    width:100%;max-width:340px;text-align:left;
  }
  .edit label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px}
  .edit .f{margin-bottom:11px}
  .edit input,.edit select{
    width:100%;font:inherit;font-size:16px;padding:10px 12px;
    border:1px solid var(--rule);border-radius:9px;background:#fff;color:var(--ink);
    -webkit-appearance:none;appearance:none;
  }
  .edit select{
    padding-right:32px;cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%236E6E78' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;background-position:right 10px center;
  }
  .edit .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .edit .act{display:flex;gap:8px;margin-top:14px}
  .edit .act button{
    flex:1;font:inherit;font-size:14px;font-weight:600;padding:11px;border-radius:9px;
    border:none;background:var(--accent);color:#fff;cursor:pointer;
  }
  .edit .act button.sec{background:var(--paper);color:var(--muted);border:1px solid var(--rule);font-weight:500}

  .altlink{
    display:inline-block;font-size:13.5px;color:var(--accent);
    text-decoration:none;border-bottom:1px solid transparent;
  }
  .altlink:hover,.altlink:focus-visible{border-bottom-color:var(--accent)}
  .footlink{margin-top:20px;text-align:center}

  /* Always visible, so there is a way back to the scanner while browsing —
     the one in the start section disappears as soon as cards are open. */
  .topbar{display:flex;align-items:center;justify-content:flex-end;gap:12px}
  .scanlink{
    display:inline-block;color:var(--accent);text-decoration:none;font-size:13.5px;
    font-weight:600;margin-bottom:12px;border-bottom:1px solid transparent;
  }
  .scanlink:hover,.scanlink:focus-visible{border-bottom-color:var(--accent)}

  .hidden{display:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header class="viewhead">
    <div>
      <h1>View Cards</h1>
      <p>Your greeting cards, kept for good.</p>
    </div>
    <button type="button" class="gear hidden" id="gearBtn" aria-label="Settings" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </button>
  </header>

  <!-- Signed-in visitors skip this and load straight into #view. It only shows
       when signed out, as a sign-in prompt. -->
  <section id="start" class="hidden">
    <div class="drop primary" id="cloudOpen" tabindex="0" role="button">
      <strong id="cloudTitle">Sign in to view your cards</strong>
      <span id="cloudSub">Google sign-in — nothing to remember</span>
    </div>

    <!-- Folder mode is now the export's reader, not a front-door feature.
         It lives on /viewer, reached by a quiet link. -->
    <div class="footlink">
      <a class="altlink" href="viewer.html">Have exported files? Open the file viewer &rarr;</a>
    </div>
  </section>

  <section id="view" class="hidden">
    <input type="search" id="q" placeholder="Search a name or occasion" autocomplete="off">
    <div class="chips" id="people"></div>
    <div class="metarow">
      <p class="meta" id="meta"></p>
      <button type="button" class="dangerbtn hidden" id="wipe">Delete All</button>
    </div>
    <div id="groups"></div>
  </section>

</div>

<div class="box hidden" id="box">
  <button id="boxClose" class="boxx" type="button" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <img id="boxImg" alt="">
  <div class="cap">
    <strong id="boxName"></strong>
    <small id="boxSub"></small>
  </div>
  <div class="nav" id="boxNav"></div>
  <div class="rowbtns hidden" id="boxTools">
    <button class="minibtn" id="boxEdit">Edit</button>
    <button class="minibtn" id="boxDl">Download</button>
    <button class="minibtn danger" id="boxDel">Delete</button>
  </div>

  <div class="edit hidden" id="boxForm">
    <div class="f"><label for="eSender">From</label><input type="text" id="eSender" autocomplete="off"></div>
    <div class="f"><label for="eRecipient">To</label><input type="text" id="eRecipient" autocomplete="off"></div>
    <div class="two">
      <div class="f"><label for="eEvent">Occasion</label>
        <select id="eEvent">
          <option value="">Occasion&hellip;</option>
          <option value="Birthday">Birthday</option>
          <option value="Anniversary">Anniversary</option>
          <optgroup label="Holidays">
            <option value="Christmas">Christmas</option>
            <option value="Mothers Day">Mother&rsquo;s Day</option>
            <option value="Fathers Day">Father&rsquo;s Day</option>
            <option value="Valentines Day">Valentine&rsquo;s Day</option>
            <option value="Easter">Easter</option>
            <option value="Thanksgiving">Thanksgiving</option>
            <option value="New Year">New Year</option>
            <option value="Lunar New Year">Lunar New Year</option>
            <option value="Hanukkah">Hanukkah</option>
          </optgroup>
          <optgroup label="Milestones">
            <option value="Graduation">Graduation</option>
            <option value="Wedding">Wedding</option>
            <option value="New Baby">New Baby</option>
            <option value="Housewarming">Housewarming</option>
            <option value="Retirement">Retirement</option>
            <option value="First Day of School">First Day of School</option>
          </optgroup>
          <optgroup label="Notes">
            <option value="Thank You">Thank You</option>
            <option value="Congratulations">Congratulations</option>
            <option value="Get Well">Get Well</option>
            <option value="Good Luck">Good Luck</option>
            <option value="Sympathy">Sympathy</option>
            <option value="Just Because">Just Because</option>
          </optgroup>
          <option value="__other">Other&hellip;</option>
        </select>
      </div>
      <div class="f"><label for="eDate">Date</label><input type="date" id="eDate"></div>
    </div>
    <div class="f hidden" id="eOtherWrap"><label for="eEventOther">Occasion name</label><input type="text" id="eEventOther" autocomplete="off" placeholder="Baptism"></div>
    <div class="act">
      <button type="button" id="eSave">Save</button>
      <button type="button" class="sec" id="eCancel">Cancel</button>
    </div>
  </div>
</div>

<!-- Reusable confirm dialog. Centred on desktop, a bottom sheet on mobile.
     Cancel is the safe default (focused on open); click-outside and Escape
     cancel, never confirm. Driven by openConfirm() below. -->
<div class="scrim hidden" id="modal">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalBody">
    <h2 id="modalTitle">Confirm</h2>
    <p id="modalBody"></p>
    <div class="sheet-acts">
      <button type="button" id="modalCancel">Cancel</button>
      <button type="button" id="modalConfirm">OK</button>
    </div>
  </div>
</div>

<!-- Settings — reached by the gear in the View header. A real list (Account
     now, export soon), not a one-off menu. Sign-out routes through the shared
     confirm dialog above. Dismiss by tapping outside or Escape. -->
<div class="scrim hidden" id="settings">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <h2 id="setTitle">Settings</h2>
    <div class="set-list">
      <div class="set-row">
        <span class="set-k">Account</span>
        <span class="set-v" id="setEmail">Signed in</span>
      </div>
      <div class="set-sep"></div>
      <button type="button" class="set-row hidden" id="setExport">
        <span>Export all</span><span class="set-hint" id="setExportHint">ZIP backup</span>
      </button>
      <div class="set-sep hidden" id="exportSep"></div>
      <button type="button" class="signout" id="setSignOut">Sign out</button>
    </div>
    <p class="setver">v2026.08.06.17</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script>
(function(){
  var cards=[],urls=[],filter=null,openCard=null,openPage=0,fromCloud=false;
  var $=function(id){return document.getElementById(id)};

  /* ==================== ARCHIVE (Firebase) ====================
     Storage rules deny `list`, so the bucket cannot be walked. The Firestore
     document for this sync code is the index: it records each card and the
     exact Storage paths of its pages, which is what we resolve below. */
  var FB={
    apiKey:"AIzaSyBycFP3HfMF7tyshQixvwzoaAE3Df8Fz_8",
    authDomain:"auth.tinywins.space",
    projectId:"tiny-wins25",
    storageBucket:"tiny-wins25.firebasestorage.app",
    messagingSenderId:"497477643272",
    appId:"1:497477643272:web:9f8e43fbffd18003e5f5bd"
  };
  var SPACE='family';   // shared space; the rules' email allowlist gates access
  var OWNER_EMAIL='aprkim@gmail.com';   // mirrors the owner in the security rules
  function isOwner(){return !!(authUser&&authUser.email===OWNER_EMAIL)}
  // Read-only viewers can't scan; hide the Scan tab once a non-owner is signed in.
  function paintScanTab(){var e=$('tabScan');if(e)e.style.display=(authUser&&!isOwner())?'none':''}
  // The tab bar parses after this script, so re-apply once the DOM is ready
  // (covers the case where auth resolves before #tabScan exists).
  document.addEventListener('DOMContentLoaded',paintScanTab);
  var fbReady=false,fbDb=null,fbStore=null,authUser=null,cloudCode='';

  /* ---- reusable confirm dialog ----
     One component for delete now, sign-out / bulk / export later. Cancel is the
     safe default: focused on open, so Enter activates it, and click-outside and
     Escape cancel — the destructive action only fires from its own button. */
  var onConfirm=null;
  function openConfirm(opts){
    $('modalTitle').textContent=opts.title||'Confirm';
    $('modalBody').textContent=opts.body||'';
    var c=$('modalConfirm');
    c.textContent=opts.confirmText||'OK';
    c.classList.toggle('danger',!!opts.danger);
    onConfirm=opts.onConfirm||null;
    $('modal').classList.remove('hidden');
    $('modalCancel').focus();
  }
  function closeConfirm(){$('modal').classList.add('hidden');onConfirm=null}
  $('modalCancel').onclick=closeConfirm;
  $('modalConfirm').onclick=function(){var fn=onConfirm;closeConfirm();if(fn)fn()};
  // Click-outside cancels; it must never trigger the destructive action
  $('modal').onclick=function(e){if(e.target===$('modal'))closeConfirm()};
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    if(!$('modal').classList.contains('hidden')){e.stopPropagation();closeConfirm();return}
    if(!$('settings').classList.contains('hidden')){e.stopPropagation();closeSettings();return}
  },true);   // capture: take Escape before the lightbox handler

  /* ---- settings sheet ----
     Opened by the gear in the View header. A real list so export can join it
     later; sign-out is the only action today and routes through openConfirm —
     the second real use of that dialog. Click-outside and Escape dismiss, the
     same as the confirm. */
  // Export is owner-only and desktop-only (a whole-archive ZIP is a big download
  // that doesn't belong on a phone). Shown only when both hold.
  var EXPORT_URL='https://us-east1-tiny-wins25.cloudfunctions.net/exportAll';
  function canExport(){return isOwner()&&window.matchMedia('(min-width:760px)').matches}
  function openSettings(){
    $('setEmail').textContent=(authUser&&authUser.email)||'Signed in';
    var exp=canExport();
    $('setExport').classList.toggle('hidden',!exp);
    $('exportSep').classList.toggle('hidden',!exp);
    $('setExportHint').textContent='ZIP backup';
    $('setExport').disabled=false;
    $('settings').classList.remove('hidden');
  }
  function closeSettings(){$('settings').classList.add('hidden')}
  $('gearBtn').onclick=openSettings;
  $('settings').onclick=function(e){if(e.target===$('settings'))closeSettings()};

  // Fetch a fresh ID token and hand it to the export function via the URL, so the
  // browser streams the ZIP straight to disk. Content-Disposition:attachment
  // keeps the current page put (it just downloads).
  $('setExport').onclick=function(){
    if(!authUser||!canExport())return;
    var btn=$('setExport'),hint=$('setExportHint');
    btn.disabled=true;hint.textContent='Preparing…';
    authUser.getIdToken().then(function(tok){
      window.location.href=EXPORT_URL+'?token='+encodeURIComponent(tok);
      setTimeout(function(){hint.textContent='Started — check downloads';btn.disabled=false;},2500);
    }).catch(function(e){
      hint.textContent='ZIP backup';btn.disabled=false;
      alert('Could not start the export. Please try again.');
      if(window.console)console.warn(e);
    });
  };
  // Signs out on the first tap — no confirm step.
  $('setSignOut').onclick=function(){closeSettings();doSignOut()};
  function doSignOut(){
    var reset=function(){
      authUser=null;cards=[];filter=null;
      $('gearBtn').classList.add('hidden');
      $('view').classList.add('hidden');
      $('start').classList.remove('hidden');
      paintCloudButton();paintScanTab();
    };
    if(!fbInit()){reset();return}
    firebase.auth().signOut().then(reset).catch(reset);
  }

  /* The whole card list lives in one document, so changing a single card is a
     read-modify-write of that array. Fine for one person editing their own
     archive; it would need a subcollection if several people edited at once. */
  function cloudMutate(fn){
    var ref=fbDb.collection('tinyCards').doc(cloudCode);
    return ref.get().then(function(doc){
      var rows=(doc.exists&&doc.data().cards)||[];
      var next=fn(rows.slice());
      return ref.set({cards:next,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    });
  }

  function fbInit(){
    if(fbReady)return true;
    if(typeof firebase==='undefined')return false;
    try{
      if(!firebase.apps.length)firebase.initializeApp(FB);
      fbDb=firebase.firestore();fbStore=firebase.storage();
      fbReady=true;return true;
    }catch(e){return false}
  }

  // Resolves with the signed-in user or null. Never prompts.
  function currentUser(){
    if(!fbInit())return Promise.resolve(null);
    if(authUser)return Promise.resolve(authUser);
    return new Promise(function(res){
      var done=false;
      var off=firebase.auth().onAuthStateChanged(function(u){
        if(done)return;
        done=true;off();authUser=u||null;res(authUser);
      });
    });
  }

  // Popup first; Safari blocks popups in Home Screen apps, so fall back
  function signIn(){
    if(!fbInit())return Promise.reject(new Error('offline'));
    var provider=new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});
    return firebase.auth().signInWithPopup(provider).then(function(r){
      authUser=r.user;return authUser;
    }).catch(function(e){
      var code=e&&e.code||'';
      if(/popup-blocked|popup-closed-by-user|operation-not-supported|cancelled-popup-request/.test(code)){
        return firebase.auth().signInWithRedirect(provider);
      }
      throw e;
    });
  }

  // Reflect whether anyone is signed in, so the button never asks for a
  // credential that does not exist — the old version prompted for a sync code
  // even when one had never been created.
  function paintCloudButton(){
    var t=$('cloudTitle'),s=$('cloudSub');
    if(!t)return;
    if(authUser){
      t.textContent='Open Your Archive';
      s.textContent=(authUser.email||authUser.displayName||'Signed in')+' · tap to open';
    }else{
      t.textContent='Sign in to view your cards';
      s.textContent='Google sign-in — nothing to remember';
    }
  }

  // Already signed in → straight into the cards, no intermediate "open" tap.
  // Signed out → show the sign-in prompt (signing in needs a click anyway).
  currentUser().then(function(u){
    if(u){
      authUser=u;
      openArchive();
    }else{
      paintCloudButton();
      $('start').classList.remove('hidden');
      if(fbReady){
        firebase.auth().getRedirectResult().then(function(r){
          if(r&&r.user){authUser=r.user;openArchive()}
        }).catch(function(){});
      }
    }
  });

  // Show the card view immediately with a loading line, then fetch. Keeps the
  // entry card from flashing when we already know who the user is.
  function openArchive(){
    $('start').classList.add('hidden');
    $('view').classList.remove('hidden');
    $('meta').textContent='Loading your cards…';
    $('groups').innerHTML='';
    loadCloud();
  }

  $('cloudOpen').onclick=loadCloud;
  $('cloudOpen').onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();loadCloud()}};

  function loadCloud(){
    $('cloudSub').textContent='Opening…';

    currentUser().then(function(u){
      return u || signIn();
    }).then(function(u){
      if(!u)return null;                 // redirect flow: we return later
      authUser=u;cloudCode=SPACE;
      paintCloudButton();
      $('gearBtn').classList.remove('hidden');   // signed in → settings reachable
      paintScanTab();                            // hide Scan for read-only viewers
      return fbDb.collection('tinyCards').doc(SPACE).get();
    }).then(function(doc){
      if(!doc)return;
      var rows=(doc.exists&&doc.data().cards)||[];
      if(!rows.length){
        // Auto-open hides #start, so the empty message must live in #view
        cards=[];fromCloud=true;
        $('start').classList.add('hidden');
        $('view').classList.remove('hidden');
        $('people').innerHTML='';$('meta').textContent='';
        $('wipe').classList.add('hidden');
        $('groups').innerHTML='<p class="empty">No cards yet — scan your first from the home screen.</p>';
        return;
      }
      // Resolve every page path to a download URL before rendering
      return Promise.all(rows.map(function(row){
        return Promise.all((row.paths||[]).map(function(p){
          return fbStore.ref().child(p).getDownloadURL().catch(function(){return null});
        })).then(function(urlsFor){
          return {row:row,urls:urlsFor.filter(Boolean)};
        });
      })).then(function(resolved){
        cards=[];fromCloud=true;
        resolved.forEach(function(x){
          if(!x.urls.length)return;
          cards.push({
            key:x.row.id,id:x.row.id,date:x.row.date||'',year:(x.row.date||'').slice(0,4),
            event:x.row.occasion||'Unsorted',person:x.row.sender||'Unknown',
            recipient:x.row.recipient||'',ok:!!x.row.date,raw:x.row,
            pages:x.urls.map(function(u,i){return {url:u,label:(x.row.labels&&x.row.labels[i])||''}})
          });
        });
        cards.sort(function(a,b){
          if(a.date===b.date)return a.person.localeCompare(b.person);
          return b.date.localeCompare(a.date);
        });
        $('start').classList.add('hidden');
        $('view').classList.remove('hidden');
        people();render();
      });
    }).catch(function(e){
      var code=e&&e.code||'';
      if(/unauthorized-domain/.test(code)){
        $('cloudSub').textContent='This site is not authorised for sign-in yet.';
      }else if(/popup-closed-by-user|cancelled-popup-request/.test(code)){
        paintCloudButton();               // user backed out; say nothing
      }else{
        $('cloudSub').textContent='Could not reach the archive.';
      }
      if(window.console)console.warn(e);
    });
  }

  /* Folder mode — reading exported files off disk — moved to viewer.html,
     a self-contained page with no Firebase. The parser and regexes it used
     live there now. This page only reads the cloud archive. */

  function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}

  var showAllPeople=false;

  function people(){
    var c={},box=$('people');box.innerHTML='';
    cards.forEach(function(x){if(x.ok)c[x.person]=(c[x.person]||0)+1});
    var names=Object.keys(c).sort(function(a,b){return c[b]-c[a]||a.localeCompare(b)});

    // Previously this silently cut off at 14, so senders beyond that simply
    // did not appear and nothing said so. Now the rest are one tap away.
    var LIMIT=14;
    var shown=(showAllPeople||names.length<=LIMIT)?names:names.slice(0,LIMIT);

    shown.forEach(function(n){
      var b=document.createElement('button');
      b.className='chip'+(filter===n?' on':'');b.type='button';
      b.innerHTML=esc(n)+'<b>'+c[n]+'</b>';
      b.onclick=function(){filter=(filter===n?null:n);people();render()};
      box.appendChild(b);
    });

    if(names.length>LIMIT){
      var more=document.createElement('button');
      more.className='chip';more.type='button';
      more.textContent=showAllPeople?'Show fewer':'+'+(names.length-LIMIT)+' more';
      more.onclick=function(){showAllPeople=!showAllPeople;people()};
      box.appendChild(more);
    }
  }

  function render(){
    var q=$('q').value.trim().toLowerCase();
    var list=cards.filter(function(x){
      if(filter&&x.person!==filter)return false;
      if(!q)return true;
      return (x.person+' '+x.recipient+' '+x.event+' '+x.date).toLowerCase().indexOf(q)>-1;
    });

    var who={},shots=0;
    list.forEach(function(x){who[x.person]=1;shots+=x.pages.length});
    $('meta').textContent=list.length+' cards \u00b7 '+shots+' photos \u00b7 '+Object.keys(who).length+' people';
    // Only offer a bulk delete for stores we own; folder files are read-only
    // Delete All is owner-only too, for the same reason as the per-card delete
    $('wipe').classList.toggle('hidden',!(fromCloud&&cards.length&&isOwner()));

    var buckets={},order=[];
    list.forEach(function(x){
      var k=x.ok?(x.year+' '+x.event):'Unsorted';
      if(!buckets[k]){buckets[k]=[];order.push(k)}
      buckets[k].push(x);
    });

    var out=$('groups');out.innerHTML='';
    if(!list.length){out.innerHTML='<p class="empty">No cards match.</p>';return}

    order.forEach(function(k){
      var sec=document.createElement('div');sec.className='group';
      var h=document.createElement('h2');
      h.innerHTML=esc(k)+'<span>'+buckets[k].length+' cards</span>';
      sec.appendChild(h);
      var g=document.createElement('div');g.className='grid';
      buckets[k].forEach(function(x){
        var b=document.createElement('button');b.className='card';b.type='button';
        var badge=x.pages.length>1?'<span class="n">'+x.pages.length+'</span>':'';
        var sub=(x.date||'no date')+(x.recipient?' · to '+x.recipient:'');
        b.innerHTML='<img loading="lazy" src="'+x.pages[0].url+'" alt="'+esc(x.person)+'">'+badge+
                    '<p>'+esc(x.person)+'</p><small>'+esc(sub)+'</small>';
        b.onclick=function(){show(x,0)};
        g.appendChild(b);
      });
      sec.appendChild(g);out.appendChild(sec);
    });
  }

  function show(card,page){
    openCard=card;openPage=page;
    var p=card.pages[page];
    $('boxImg').src=p.url;
    $('boxName').textContent=card.person+(card.recipient?' \u2192 '+card.recipient:'');
    $('boxSub').textContent=(card.date?card.date+' \u00b7 ':'')+card.event;
    var nav=$('boxNav');nav.innerHTML='';
    if(card.pages.length>1){
      card.pages.forEach(function(pg,i){
        var b=document.createElement('button');
        b.type='button';b.textContent=pg.label||('p'+(i+1));
        if(i===page)b.className='on';
        b.onclick=function(e){e.stopPropagation();show(card,i)};
        nav.appendChild(b);
      });
    }
    // Editing and deleting are the owner's alone — viewers (Nathan, Hazel) are
    // read-only, so those controls must not even render for them. Download
    // stays available to anyone who can see the card.
    var owner=fromCloud&&isOwner();
    $('boxTools').classList.toggle('hidden',!fromCloud);
    $('boxEdit').classList.toggle('hidden',!owner);
    $('boxDel').classList.toggle('hidden',!owner);
    $('boxForm').classList.add('hidden');$('box').classList.remove('editing');
    $('box').classList.remove('hidden');
  }

  function close(){
    $('box').classList.add('hidden');$('boxImg').src='';openCard=null;
    $('boxForm').classList.add('hidden');$('box').classList.remove('editing');
  }

  /* ---- library editing ---- */
  // Point the Occasion dropdown at the card's current value. If that value isn't
  // one of the presets (an old free-text occasion), add it as its own option so
  // it still shows and isn't silently lost.
  function setEventSelect(ev){
    var sel=$('eEvent');
    Array.prototype.slice.call(sel.querySelectorAll('option[data-custom]')).forEach(function(o){o.remove()});
    $('eOtherWrap').classList.add('hidden');$('eEventOther').value='';
    var known=Array.prototype.some.call(sel.options,function(o){return o.value===ev});
    if(ev&&!known){
      var op=document.createElement('option');
      op.value=ev;op.textContent=ev;op.setAttribute('data-custom','1');
      sel.insertBefore(op,sel.querySelector('option[value="__other"]'));
    }
    sel.value=ev||'';
  }
  function readEventValue(){
    return $('eEvent').value==='__other'?$('eEventOther').value.trim():$('eEvent').value.trim();
  }
  $('eEvent').onchange=function(){
    var other=$('eEvent').value==='__other';
    $('eOtherWrap').classList.toggle('hidden',!other);
    if(other)$('eEventOther').focus();
  };

  $('boxEdit').onclick=function(e){
    e.stopPropagation();
    if(!openCard)return;
    $('eSender').value=openCard.person==='Unknown'?'':openCard.person;
    $('eRecipient').value=openCard.recipient||'';
    setEventSelect(openCard.event==='Unsorted'?'':openCard.event);
    $('eDate').value=openCard.date||'';
    var hidden=$('boxForm').classList.toggle('hidden');
    $('box').classList.toggle('editing',!hidden);
  };
  $('eCancel').onclick=function(e){
    e.stopPropagation();
    $('boxForm').classList.add('hidden');$('box').classList.remove('editing');
  };

  $('eSave').onclick=function(e){
    e.stopPropagation();
    if(!openCard)return;
    var row=openCard.raw;
    row.sender=$('eSender').value.trim()||'Unknown';
    row.recipient=$('eRecipient').value.trim();
    row.occasion=readEventValue()||'Unsorted';
    row.date=$('eDate').value||'';

    cloudMutate(function(rows){
      return rows.map(function(x){
        if(x.id!==row.id)return x;
        x.sender=row.sender;x.recipient=row.recipient;
        x.occasion=row.occasion;x.date=row.date;
        return x;
      });
    }).then(function(){
      openCard.person=row.sender;openCard.recipient=row.recipient;
      openCard.event=row.occasion;openCard.date=row.date;
      openCard.year=row.date.slice(0,4);openCard.ok=!!row.date;
      $('boxForm').classList.add('hidden');$('box').classList.remove('editing');
      $('boxName').textContent=openCard.person+(openCard.recipient?' → '+openCard.recipient:'');
      $('boxSub').textContent=(openCard.date?openCard.date+' · ':'')+openCard.event;
      filter=null;people();render();
    }).catch(function(e){
      alert('Could not save the change.');
      if(window.console)console.warn(e);
    });
  };

  $('boxDel').onclick=function(e){
    e.stopPropagation();
    if(!openCard||!isOwner())return;
    var card=openCard;
    openConfirm({
      title:'Delete this card?',
      body:'It disappears from your archive on every device.',
      confirmText:'Delete',
      danger:true,
      onConfirm:function(){deleteCard(card)}
    });
  };

  function deleteCard(card){
    var id=card.id;
    // Remove the images first, then the index entry. If an image delete fails
    // the entry survives, which is recoverable; the reverse would orphan files
    // nothing points at.
    var paths=(card.raw&&card.raw.paths)||[];
    Promise.all(paths.map(function(p){
      return fbStore.ref().child(p).delete().catch(function(){});
    })).then(function(){
      return cloudMutate(function(rows){
        return rows.filter(function(x){return x.id!==id});
      });
    }).then(function(){
      cards=cards.filter(function(c){return c.id!==id});
      close();filter=null;people();render();
    }).catch(function(e){
      alert('Could not delete that card.');
      if(window.console)console.warn(e);
    });
  }

  $('boxDl').onclick=function(e){
    e.stopPropagation();
    if(!openCard)return;
    var c=openCard;
    var clean=function(s){return (s||'').replace(/[\/\\:*?"<>|]/g,'').replace(/\s+/g,' ').trim()};
    var base=(c.date||'Date')+' '+(clean(c.event)||'Occasion')+
             (c.recipient?' - '+clean(c.recipient):'')+' from '+(clean(c.person)||'Sender');
    var n=c.pages.length;
    var nameFor=function(i,type){
      return base+(n>1?' - '+((c.pages[i]&&c.pages[i].label)||('p'+(i+1))):'')+
             (type==='image/png'?'.png':'.jpg');
    };
    var push=function(blob,i){
      var u=URL.createObjectURL(blob);
      var a=document.createElement('a');a.href=u;a.download=nameFor(i,blob.type);
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(u)},1500);
    };

    c.pages.forEach(function(pg,i){
      setTimeout(function(){
        fetch(pg.url).then(function(r){return r.blob()})
          .then(function(bl){push(bl,i)})
          .catch(function(){alert('Could not download that page.')});
      },i*350);
    });
  };

  $('boxClose').onclick=close;
  $('box').onclick=function(e){if(e.target===$('box'))close()};
  document.addEventListener('keydown',function(e){
    // Don't hijack arrow keys while the user is typing in the edit form
    var t=e.target,typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA');
    if(e.key==='Escape'){
      if(typing&&!$('boxForm').classList.contains('hidden')){$('boxForm').classList.add('hidden');return}
      close();
    }
    if(!openCard||typing)return;
    if(e.key==='ArrowRight'&&openPage<openCard.pages.length-1)show(openCard,openPage+1);
    if(e.key==='ArrowLeft'&&openPage>0)show(openCard,openPage-1);
  });
  $('q').addEventListener('input',render);

  /* ---- delete everything ----
     Irreversible and, for the cloud archive, affects every device sharing the
     code. A plain confirm() is too easy to click through for that, so this
     asks the user to type the word. */
  $('wipe').onclick=function(){
    var n=cards.length;
    if(!n)return;
    var typed=prompt('Delete all '+n+' card'+(n===1?'':'s')+' from your archive, on every device?\n\n'+
                     'This cannot be undone. Exported files are not affected.\n\n'+
                     'Type DELETE to confirm:');
    if(!typed||typed.trim().toUpperCase()!=='DELETE')return;

    $('wipe').disabled=true;$('wipe').textContent='Deleting…';

    var paths=[];
    cards.forEach(function(c){
      if(c.raw&&c.raw.paths)paths=paths.concat(c.raw.paths);
    });
    // Images first, then the index — a failure here leaves recoverable entries
    // rather than files nothing points at.
    Promise.all(paths.map(function(p){
      return fbStore.ref().child(p).delete().catch(function(){});
    })).then(function(){
      return fbDb.collection('tinyCards').doc(cloudCode).delete();
    }).then(function(){
      cards=[];filter=null;
      $('wipe').disabled=false;$('wipe').textContent='Delete All';
      people();render();
      $('view').classList.add('hidden');
      $('start').classList.remove('hidden');
      paintCloudButton();
    }).catch(function(e){
      $('wipe').disabled=false;$('wipe').textContent='Delete All';
      alert('Could not delete everything. Some cards may remain.');
      if(window.console)console.warn(e);
    });
  };

  /* View only fetches on load, so a card scanned in another tab wouldn't show
     until a manual reload. Re-pull when the page regains focus (flipping back
     from the scanner during an upload run) and on bfcache restore — but never
     while a card is open, being edited, or a dialog is up, since a re-render
     would yank that away. */
  function refreshArchive(){
    if(!authUser)return;                                     // signed out
    if(!$('box').classList.contains('hidden'))return;        // lightbox / edit open
    if(!$('settings').classList.contains('hidden'))return;   // settings sheet open
    if(!$('modal').classList.contains('hidden'))return;      // confirm dialog open
    loadCloud();
  }
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible')refreshArchive();
  });
  window.addEventListener('pageshow',function(e){if(e.persisted)refreshArchive()});
})();
</script>
